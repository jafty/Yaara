[project]
name = "yaara"
version = "0.1.0"
description = "A turn-based strategy game of rival oasis kingdoms"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2.12,<5.3",
  "dj-database-url>=3.0,<4",
  "psycopg[binary]>=3.2,<4",
  "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
    "playwright>=1.55,<2",
    "coverage>=7.13,<8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "yaara.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
  "case(identifier, requirement): stable use-case variation and its source requirement",
  "logic: pure rules, engine or projection cases without database access",
  "integration: application, HTTP and real PostgreSQL boundary cases",
  "journey: additional multi-stage simulation regression coverage",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["simulation.engine", "simulation.rules", "simulation.projections", "simulation.narration", "simulation.calendar"]
data_file = "artifacts/core.coverage"

[tool.coverage.report]
fail_under = 100
show_missing = true
precision = 2

[tool.coverage.json]
output = "artifacts/core-coverage.json"
