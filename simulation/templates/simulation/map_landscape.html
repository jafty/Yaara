{% load l10n %}
<defs>
    <g id="atlas-mountains">
        <path class="terrain-wash" d="M-42 12-20-15-6 2 9-24 39 12Z"/>
        <path d="M-42 12-20-15-6 2 9-24 39 12M-25-9-20-5-15-9M2-13 9-8 15-16M9-8 18 6M-20-5-24 5M-47 17Q-8 12 44 17"/>
    </g>
    <g id="atlas-dunes">
        <path class="terrain-wash" d="M-43 9Q-18-15 5 0T43 9Q16 16-6 10T-43 9Z"/>
        <path d="M-43 9Q-18-15 5 0T43 9M-10-4Q-7 3 8 7M-35 18Q-13 9 5 16M19 20Q29 15 39 18"/>
    </g>
    <g id="atlas-rocks">
        <path class="terrain-wash" d="M-25 10-20-2-9-6 1 10ZM-3 10 5-13 16-16 27 10Z"/>
        <path d="M-25 10-20-2-9-6 1 10M-3 10 5-13 16-16 27 10M5-13 12-6 10 5M-20-2-14 3M-31 15Q-5 10 33 15"/>
    </g>
</defs>
<g class="map-landscape" aria-hidden="true" pointer-events="none">
    {% for city in view.cities %}
        <g transform="translate({{ city.x|unlocalize }} {{ city.y|unlocalize }})">
            {% if city.id == 'c2' %}<use href="#atlas-mountains" transform="translate(0 -61)"/>
            {% elif city.id == 'c3' or city.id == 'c5' %}<use href="#atlas-dunes" transform="translate(0 -65)"/>
            {% elif city.id == 'c6' %}<use href="#atlas-rocks" transform="translate(0 -64)"/>
            {% elif city.id == 'c8' %}<use href="#atlas-mountains" transform="translate(0 -72) scale(.75)"/>{% endif %}
        </g>
    {% endfor %}
</g>
