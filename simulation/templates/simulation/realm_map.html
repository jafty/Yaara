{% load i18n l10n %}
<figure class="realm-map" aria-labelledby="map-caption">
    <figcaption id="map-caption" class="visually-hidden">{% translate "Les oasis de Yaara" %}</figcaption>
    <div class="map-frame">
        <svg class="map-sheet" viewBox="0 0 680 500" preserveAspectRatio="xMidYMid meet" aria-labelledby="map-title map-description">
            <title id="map-title">{% translate "Carte des oasis de Yaara" %}</title>
            <desc id="map-description">{% translate "Chaque cité possède un territoire teinté aux couleurs de sa maison. Les sceaux identifient les propriétaires. Double cercle : votre domaine ; losange : cité à portée ; cercle simple : hors de portée ; pointillés : expédition engagée." %}</desc>
            <defs><marker id="march-tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="context-stroke"/></marker></defs>
            <g class="map-connections" aria-hidden="true">
                {% for link in view.links %}<line class="map-connection{% if city_requested and selected.id == link.first.id or city_requested and selected.id == link.second.id %} selected-road{% endif %}" data-first="{{ link.first.id }}" data-second="{{ link.second.id }}" x1="{{ link.first.x|unlocalize }}" y1="{{ link.first.y|unlocalize }}" x2="{{ link.second.x|unlocalize }}" y2="{{ link.second.y|unlocalize }}"/>{% endfor %}
            </g>
            {% for city in view.cities %}
                <a class="map-city house-{{ city.owner }}" data-map-state="{% if city.engaged %}engaged{% elif city.owned %}owned{% elif city.reachable %}reachable{% else %}unreachable{% endif %}" href="{% if workspace %}?{{ city.map_query }}#map-context{% else %}?tab=wars&amp;city={{ city.id }}#map-context{% endif %}" {% if city_requested and selected.id == city.id %}aria-current="location"{% endif %} aria-label="{{ city.name }} · {{ city.owner_name }} · {{ city.wall_label }} · {% include 'simulation/map_status.html' %}">
                    <polygon class="map-territory" points="{{ city.territory }}"/>
                    <g transform="translate({{ city.x|unlocalize }} {{ city.y|unlocalize }})">
                        {% include 'simulation/map_marker.html' with owned=city.owned reachable=city.reachable engaged=city.engaged %}
                        {% include 'simulation/house_mark.html' with owner=city.owner %}
                        {% if city.incoming_warnings %}<g class="map-warning" data-threat-city="{{ city.id }}"><title>{% translate "Armée signalée" %}</title><path d="M25,-60 L47,-22 L3,-22 Z"/><text x="25" y="-30" text-anchor="middle">!</text></g>{% endif %}
                        <text class="map-name" y="62" text-anchor="middle">{{ city.name }}</text>
                    </g>
                </a>
            {% endfor %}
            {% for march in marches %}<a class="map-march march-{{ march.state }}" data-march-state="{{ march.state }}" href="?tab=mail&amp;mail=schedule#{{ march.anchor }}" aria-label="{{ march.label }} · {{ march.target.name }} · {{ march.moon }}">
                <title>{{ march.label }} · {{ march.target.name }} · {{ march.moon }}</title>
                <path class="march-hit" d="{{ march.path }}"/>
                <path class="march-line" d="{{ march.path }}" marker-end="url(#march-tip)"/>
            </a>{% endfor %}
            <g id="draft-route" aria-hidden="true"></g>
        </svg>
    </div>
    <ul class="map-legend" aria-label="{% translate 'Les maisons de Yaara' %}">{% for rank in view.ranking %}<li class="house-{{ rank.actor }}"><span class="house-seal" aria-hidden="true">{% include 'simulation/house_mark.html' with owner=rank.actor %}</span> {{ rank.name }}</li>{% endfor %}</ul>
    <p class="aside-text map-instruction">{% translate "Choisissez une cité. Les routes déterminent les déplacements ; le terrain est décoratif." %}</p>
    {% if marches %}<p class="march-legend">{% translate "Pointillés : ordre scellé · Trait plein : en route · Bleu : retour" %}</p>{% endif %}
    <details class="map-reference"><summary>{% translate "Comprendre la carte" %}</summary>
    <ul class="map-legend map-states" aria-label="{% translate 'Comprendre la carte' %}">
        <li><svg class="map-key" viewBox="-40 -40 80 80" aria-hidden="true">{% include 'simulation/map_marker.html' with owned=True reachable=False engaged=False %}</svg>{% translate "Votre domaine" %}</li>
        <li><svg class="map-key" viewBox="-40 -40 80 80" aria-hidden="true">{% include 'simulation/map_marker.html' with owned=False reachable=True engaged=False %}</svg>{% translate "À portée" %}</li>
        <li><svg class="map-key" viewBox="-40 -40 80 80" aria-hidden="true">{% include 'simulation/map_marker.html' with owned=False reachable=False engaged=False %}</svg>{% translate "Hors de portée" %}</li>
        <li><svg class="map-key" viewBox="-40 -40 80 80" aria-hidden="true">{% include 'simulation/map_marker.html' with owned=False reachable=False engaged=True %}</svg>{% translate "Expédition engagée" %}</li>
    </ul>
    <p class="aside-text">{% translate "Les frontières sont indicatives ; seules les routes relient les cités." %}</p>
    </details>
</figure>
