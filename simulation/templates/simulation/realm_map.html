{% load i18n l10n %}
<figure class="realm-map" aria-labelledby="map-caption">
    <figcaption id="map-caption" class="visually-hidden">{% translate "Les oasis de Yaara" %}</figcaption>
    <div class="map-frame">
        <svg class="map-sheet" viewBox="0 0 680 500" aria-labelledby="map-title map-description">
            <title id="map-title">{% translate "Carte des oasis de Yaara" %}</title>
            <desc id="map-description">{% translate "Les cités de votre maison portent un double cercle. Les pointillés signalent une expédition engagée. Choisissez une cité pour consulter ses fortifications et donner vos ordres." %}</desc>
            {% for city in view.cities %}
                <a class="map-city house-{{ city.owner }}{% if city.owned %} map-owned{% endif %}{% if city.engaged %} map-engaged{% endif %}" href="?tab=wars&amp;city={{ city.id }}#map-context" {% if city_requested and selected.id == city.id %}aria-current="location"{% endif %} aria-label="{{ city.name }} · {{ city.owner_name }} · {{ city.wall_label }}{% if city.engaged %} · {% translate 'Expédition engagée' %}{% endif %}">
                    <g transform="translate({{ city.x|unlocalize }} {{ city.y|unlocalize }})">
                        <circle class="map-hit" r="54"/>
                        <circle class="map-marker" r="18"/>
                        {% if city.owned %}<circle class="map-inner" r="11"/>{% endif %}
                        {% if city.engaged %}<circle class="map-engagement" r="27"/>{% endif %}
                        <text y="47" text-anchor="middle">{{ city.name }}</text>
                    </g>
                </a>
            {% endfor %}
        </svg>
    </div>
    <ul class="map-legend" aria-label="{% translate 'Les maisons de Yaara' %}">{% for rank in view.ranking %}<li class="house-{{ rank.actor }}"><span aria-hidden="true">{% if rank.own %}◎{% else %}○{% endif %}</span> {{ rank.name }}</li>{% endfor %}</ul>
    <p class="aside-text">{% translate "Les distances sont symboliques ; toute expédition suit le même calendrier." %}</p>
</figure>
