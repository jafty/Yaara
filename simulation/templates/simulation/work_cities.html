{% load i18n l10n %}
{% for city in action.cities %}
    <div class="city-choice{% if interactive and not city.available %} disabled{% endif %}" data-work-status="{{ city.status }}">
        {% if interactive %}<label class="work-city-heading">
            <input type="checkbox" name="cities" value="{{ city.id }}" data-cost="{{ city.cost|unlocalize }}" data-shortfall="{{ city.shortfall|unlocalize }}" {% if not city.available %}disabled{% elif city.id in selected_cities or city_requested and selected.id == city.id %}checked{% endif %}>
            <strong>{{ city.name }}</strong>
        </label>{% else %}<strong class="work-city-heading">{{ city.name }}</strong>{% endif %}
        {% include 'simulation/team_status.html' %}
        {% include 'simulation/work_details.html' %}
    </div>
{% endfor %}
