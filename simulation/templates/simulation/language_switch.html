{% load i18n %}
<form action="{% url 'set_language' %}" method="post" class="language-switch">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    {% get_current_language as current_language %}
    <label for="language">{% translate "Langue" %}</label>
    <select name="language" id="language">
        <option value="fr" {% if current_language == 'fr' %}selected{% endif %}>Français</option>
        <option value="en" {% if current_language == 'en' %}selected{% endif %}>English</option>
    </select>
    <button type="submit">{% translate "Choisir" %}</button>
</form>
