services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yaara
      POSTGRES_USER: yaara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaara -d yaara"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  database:
